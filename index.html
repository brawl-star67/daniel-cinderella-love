<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daniel ❤️ Cinderella</title>

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    color: #fff;
    overflow-x: hidden;
}

/* ✨ Premium Glass Effect */
.glass {
    background: rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-radius: 25px;
    border: 1px solid rgba(255,255,255,0.25);
    box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    padding: 25px;
    margin: 20px;
}

/* Title */
h1 {
    text-align: center;
    font-size: 2.8rem;
    margin-bottom: 10px;
}

h2 {
    text-align: center;
    font-weight: 400;
}

/* Typing */
.typing {
    text-align: center;
    margin-top: 10px;
    font-size: 1.2rem;
}

/* Counter */
.counter {
    text-align: center;
    margin-top: 10px;
}

/* 📸 Gallery */
.gallery {
    display: flex;
    flex-direction: column;
    gap: 40px;
    padding: 20px;
}

/* Scroll animation */
.photo {
    opacity: 0;
    transform: translateY(60px) scale(0.95);
    transition: all 0.8s ease;
}

.photo.show {
    opacity: 1;
    transform: translateY(0) scale(1);
}

/* Image style */
.photo img {
    width: 100%;
    max-width: 500px;
    border-radius: 20px;
    display: block;
    margin: auto;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

/* Video */
video {
    width: 100%;
    max-width: 500px;
    border-radius: 20px;
    display: block;
    margin: auto;
}

/* Floating Hearts */
.heart {
    position: fixed;
    bottom: -10px;
    color: red;
    animation: float 6s linear infinite;
}

@keyframes float {
    0% { transform: translateY(0); opacity: 1; }
    100% { transform: translateY(-100vh); opacity: 0; }
}

/* Footer */
.footer {
    text-align: center;
    margin: 30px;
}
</style>
</head>

<body>

<!-- 💖 Floating Hearts -->
<script>
setInterval(() => {
    let heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (10 + Math.random()*20) + "px";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 6000);
}, 300);
</script>

<!-- 🎉 Hero Section -->
<div class="glass">
    <h1>Daniel ❤️ Cinderella</h1>
    <h2>Happy 3rd Anniversary 🎉</h2>
    <div class="typing" id="text"></div>
    <div class="counter" id="counter"></div>
</div>

<!-- 📸 Scroll Gallery -->
<div class="gallery">

    <div class="photo"><img src="photo1.jpg"></div>
    <div class="photo"><img src="photo2.jpg"></div>
    <div class="photo"><img src="photo3.jpg"></div>
    <div class="photo"><img src="photo4.jpg"></div>
    <div class="photo"><img src="photo5.jpg"></div>
    <div class="photo"><img src="photo6.jpg"></div>

</div>

<!-- 🎥 Video -->
<div class="glass">
    <h2 style="text-align:center;">Our Special Moments 🎥</h2>
    <video controls>
        <source src="video.mp4" type="video/mp4">
    </video>
</div>

<!-- 🎵 Music -->
<audio autoplay loop>
    <source src="music.mp3" type="audio/mp3">
</audio>

<div class="footer">
    Made with ❤️ by Daniel for Cinderella
</div>

<script>
/* 💌 Typing */
const text = "Three years, countless memories, and a lifetime to go... I love you 💖";
let i = 0;
function typing() {
    if (i < text.length) {
        document.getElementById("text").innerHTML += text.charAt(i);
        i++;
        setTimeout(typing, 40);
    }
}
typing();

/* ⏳ Counter */
const startDate = new Date("2021-05-01"); // change this
function updateCounter() {
    let now = new Date();
    let diff = now - startDate;
    let days = Math.floor(diff / (1000*60*60*24));
    document.getElementById("counter").innerHTML =
        "Together for " + days + " days ❤️";
}
updateCounter();
setInterval(updateCounter, 1000);

/* 📸 Scroll Reveal */
const photos = document.querySelectorAll('.photo');

window.addEventListener('scroll', () => {
    photos.forEach(photo => {
        const rect = photo.getBoundingClientRect();
        if (rect.top < window.innerHeight - 100) {
            photo.classList.add('show');
        }
    });
});
</script>

</body>
</html>
